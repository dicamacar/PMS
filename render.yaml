services:
  - type: web
    name: pms-tablero-agendamiento
    runtime: static
    branch: main
    rootDir: outputs
    buildCommand: 'echo "Static assets already built"'
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
